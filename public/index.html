<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoPesa Uganda Micro-Finance Portal</title>
    <style>
        :root { --mtn-yellow: #FFCC00; --dark-blue: #0A192F; --text-dark: #333333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #f4f6f9; color: var(--text-dark); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .form-container { background: white; width: 100%; max-width: 500px; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); border-top: 8px solid var(--mtn-yellow); }
        .header { text-align: center; margin-bottom: 25px; }
        .header h2 { color: var(--dark-blue); font-size: 24px; margin-bottom: 5px; }
        .header p { color: #666; font-size: 14px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; color: var(--dark-blue); }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; outline: none; }
        .submit-btn { width: 100%; padding: 14px; background-color: var(--mtn-yellow); border: none; border-radius: 6px; font-size: 16px; font-weight: bold; color: var(--dark-blue); cursor: pointer; transition: background 0.2s; }
        .submit-btn:hover { background-color: #e5b800; }
        
        /* Spinner Framework Components */
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 25, 47, 0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .loading-overlay.active { opacity: 1; pointer-events: auto; }
        .spinner {
            width: 60px; height: 60px; border: 6px solid rgba(255, 255, 255, 0.2);
            border-top: 6px solid var(--mtn-yellow); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        .loading-text { color: white; font-size: 16px; font-weight: 600; text-align: center; line-height: 1.5; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .alert { padding: 12px; margin-top: 15px; border-radius: 6px; font-size: 14px; display: none; text-align: center; }
        .alert.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="header">
            <h2>MoPesa Uganda</h2>
            <p>Interactive Telegram-Connected Application Pipeline</p>
        </div>
        
        <form id="loanForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" required placeholder="Mukasa Ronald">
            </div>
            <div class="form-group">
                <label>MTN Mobile Money Number</label>
                <input type="tel" id="mtnNumber" required placeholder="0771234567">
            </div>
            <div class="form-group">
                <label>Loan Amount Needed (UGX)</label>
                <input type="number" id="loanAmount" min="5000" max="3000000" required placeholder="500000">
            </div>
            <div class="form-group">
                <label>Repayment Horizon Term</label>
                <select id="repaymentPeriodMonths" required>
                    <option value="" disabled selected>Select timeline length</option>
                    <option value="1">1 Month</option>
                    <option value="3">3 Months</option>
                    <option value="6">6 Months</option>
                    <option value="12">12 Months</option>
                    <option value="18">18 Months</option>
                    <option value="24">24 Months</option>
                </select>
            </div>
            <div class="form-group">
                <label>Average Monthly Income (UGX)</label>
                <input type="number" id="monthlyIncome" required placeholder="1200000">
            </div>
            <div class="form-group">
                <label>Intended Purpose Asset Class</label>
                <select id="intendedPurpose" required>
                    <option value="" disabled selected>Select usage vector</option>
                    <option value="farming">Farming / Agriculture</option>
                    <option value="business">Business Operational Capital</option>
                    <option value="other">Other / Personal Contingency</option>
                </select>
            </div>
            
            <button type="submit" class="submit-btn">Submit to Telegram Control Board</button>
        </form>

        <div id="formAlert" class="alert"></div>
    </div>

    <!-- The Spinner Overlay Component -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">Broadcasting details down to management system...<br>Awaiting Administrative Verification Actions.</div>
    </div>

    <script>
        document.getElementById('loanForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const overlay = document.getElementById('loadingOverlay');
            const alertBox = document.getElementById('formAlert');
            
            alertBox.style.display = 'none';
            overlay.classList.add('active'); // Activates loader spinner overlay frame instantly
            
            const payload = {
                fullName: document.getElementById('fullName').value,
                mtnNumber: document.getElementById('mtnNumber').value,
                loanAmount: parseFloat(document.getElementById('loanAmount').value),
                repaymentPeriodMonths: parseInt(document.getElementById('repaymentPeriodMonths').value),
                monthlyIncome: parseFloat(document.getElementById('monthlyIncome').value),
                intendedPurpose: document.getElementById('intendedPurpose').value
            };

            try {
                const response = await fetch('/api/loans/apply', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                overlay.classList.remove('active'); // Drops spinner once handshake is finalized
                
                if (response.ok && result.success) {
                    alertBox.className = 'alert success';
                    alertBox.innerText = `Application Broadcast Completed successfully! Track ID: ${result.applicationId}`;
                    document.getElementById('loanForm').reset();
                } else {
                    alertBox.className = 'alert error';
                    alertBox.innerText = `Error: ${result.error || 'Check server configuration profiles.'}`;
                }
            } catch (err) {
                overlay.classList.remove('active');
                alertBox.className = 'alert error';
                alertBox.innerText = "Network Failure: Unable to bind data to host proxy infrastructure.";
            }
            alertBox.style.display = 'block';
        });
    </script>
</body>
</html>
